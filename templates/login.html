{% extends "base.html" %}

{% block title %}Connexion - CodeShare{% endblock %}

{% block extra_css %}
<style>
    body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    
    .login-container {
        background: white;
        border-radius: 12px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        padding: 40px;
        width: 100%;
        max-width: 450px;
        animation: fadeIn 0.5s ease-out;
    }
    
    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(-20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    
    .login-header {
        text-align: center;
        margin-bottom: 30px;
    }
    
    .login-header .logo {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-size: 2rem;
        font-weight: bold;
        color: var(--primary);
        margin-bottom: 10px;
    }
    
    .login-header .logo i {
        color: var(--accent);
    }
    
    .login-header h2 {
        color: var(--gray);
        font-size: 1.2rem;
        font-weight: normal;
    }
    
    .form-group {
        margin-bottom: 20px;
    }
    
    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 500;
        color: var(--primary);
    }
    
    .form-control {
        width: 100%;
        padding: 12px 16px;
        border: 1px solid #e1e4e8;
        border-radius: 6px;
        font-size: 1rem;
        transition: all 0.3s;
    }
    
    .form-control:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(9, 105, 218, 0.1);
    }
    
    .btn-login {
        width: 100%;
        padding: 12px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s;
    }
    
    .btn-login:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }
    
    .divider {
        text-align: center;
        margin: 20px 0;
        color: var(--gray);
        position: relative;
    }
    
    .divider::before,
    .divider::after {
        content: '';
        position: absolute;
        top: 50%;
        width: 40%;
        height: 1px;
        background: #e1e4e8;
    }
    
    .divider::before {
        left: 0;
    }
    
    .divider::after {
        right: 0;
    }
    
    .signup-link {
        text-align: center;
        margin-top: 20px;
        color: var(--gray);
    }
    
    .signup-link a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 600;
    }
    
    .signup-link a:hover {
        text-decoration: underline;
    }
    
    .flash-messages {
        margin-bottom: 20px;
    }
</style>
{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-header">
        <div class="logo">
            <i class="fab fa-github"></i>
            <span>CodeShare</span>
        </div>
        <h2>Connectez-vous à votre compte</h2>
    </div>
    
    <form method="POST" action="{{ url_for('login') }}">
        <div class="form-group">
            <label for="username">
                <i class="fas fa-user"></i> Nom d'utilisateur
            </label>
            <input type="text" id="username" name="username" class="form-control" 
                   placeholder="Entrez votre nom d'utilisateur" required autofocus>
        </div>
        
        <div class="form-group">
            <label for="password">
                <i class="fas fa-lock"></i> Mot de passe
            </label>
            <input type="password" id="password" name="password" class="form-control" 
                   placeholder="Entrez votre mot de passe" required>
        </div>
        
        <button type="submit" class="btn-login">
            <i class="fas fa-sign-in-alt"></i> Se connecter
        </button>
    </form>
    
    <div class="divider">OU</div>
    
    <div class="signup-link">
        Pas encore de compte ? <a href="{{ url_for('signup') }}">Créer un compte</a>
    </div>
</div>
{% endblock %}
