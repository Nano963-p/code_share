{% extends "base.html" %}

{% block title %}Connexion - Mini GitHub{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="bi bi-github" style="font-size: 3rem; color: #667eea;"></i>
                    <h2 class="mt-3">Connexion</h2>
                    <p class="text-muted">Accédez à votre compte Mini GitHub</p>
                </div>

                <form method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label">Nom d'utilisateur</label>
                        <input type="text" class="form-control" id="username" name="username" required autofocus>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Mot de passe</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="bi bi-box-arrow-in-right"></i> Se connecter
                        </button>
                    </div>

                    <div class="text-center">
                        <p class="text-muted mb-0">Pas encore de compte ?</p>
                        <a href="{{ url_for('signup') }}" class="text-decoration-none fw-bold">Créer un compte</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
