{% extends "base.html" %}

{% block title %}Inscription - Mini GitHub{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="bi bi-person-plus-fill" style="font-size: 3rem; color: #667eea;"></i>
                    <h2 class="mt-3">Créer un compte</h2>
                    <p class="text-muted">Rejoignez Mini GitHub aujourd'hui</p>
                </div>

                <form method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label">Nom d'utilisateur</label>
                        <input type="text" class="form-control" id="username" name="username" required autofocus>
                        <div class="form-text">Choisissez un nom unique</div>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Mot de passe</label>
                        <input type="password" class="form-control" id="password" name="password" required minlength="6">
                        <div class="form-text">Au moins 6 caractères</div>
                    </div>

                    <div class="mb-3">
                        <label for="confirm_password" class="form-label">Confirmer le mot de passe</label>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="bi bi-check-circle"></i> Créer mon compte
                        </button>
                    </div>

                    <div class="text-center">
                        <p class="text-muted mb-0">Déjà un compte ?</p>
                        <a href="{{ url_for('login') }}" class="text-decoration-none fw-bold">Se connecter</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
