{% extends "base.html" %}

{% block title %}Page non trouvée - Mini GitHub{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 text-center">
        <div class="card">
            <div class="card-body p-5">
                <i class="bi bi-exclamation-triangle-fill text-warning" style="font-size: 5rem;"></i>
                <h1 class="display-1 mt-3">404</h1>
                <h3 class="mb-3">Page non trouvée</h3>
                <p class="text-muted mb-4">
                    Désolé, la page que vous recherchez n'existe pas ou a été déplacée.
                </p>
                <a href="{{ url_for('dashboard') if session.user_id else url_for('login') }}" 
                   class="btn btn-primary btn-lg">
                    <i class="bi bi-house-door"></i> Retour à l'accueil
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
