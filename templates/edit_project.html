{% extends "base.html" %}
{% block title %}Edit project · CodeShare{% endblock %}

{% block content %}
<section class="form-page">
  <div class="form-page-head">
    <h1 class="form-page-title">Edit project</h1>
    <a class="btn btn-ghost" href="{{ url_for('project', pid=project.id) }}">
      <i class="fa-solid fa-arrow-left"></i>
      Back
    </a>
  </div>

  <div class="form-card">
    <div class="form-card-body">
      <form class="form-grid" method="POST" action="{{ url_for('edit_project', pid=project.id) }}">
        <div>
          <label>Title</label>
          <input name="title" type="text" minlength="3" required value="{{ project.title }}">
        </div>

        <div>
          <label>Description</label>
          <textarea name="description" rows="5" placeholder="Describe your project...">{{ project.description or '' }}</textarea>
        </div>

        <div>
          <label>Languages (you can select multiple)</label>
          <select name="languages" multiple size="8">
            {% for lang in language_choices %}
              <option value="{{ lang }}" {% if lang in current_languages %}selected{% endif %}>{{ lang }}</option>
            {% endfor %}
          </select>
          <div class="muted small">Tip: hold Ctrl (Windows) or Cmd (Mac) to select multiple. You can also add custom languages below.</div>
        </div>

        <div>
          <label>Custom languages (optional)</label>
          <input name="custom_languages" type="text" placeholder="e.g. Python, SQL, Docker">
          <div class="muted small">Use commas to separate multiple entries.</div>
        </div>

        <label class="check">
          <input type="checkbox" name="is_private" value="1" {% if project.is_private %}checked{% endif %}>
          <span>Private project</span>
        </label>

        <div>
          <label>Status</label>
          <select name="status">
            <option value="active" {% if project.status == 'active' %}selected{% endif %}>Active</option>
            <option value="archived" {% if project.status == 'archived' %}selected{% endif %}>Archived</option>
          </select>
        </div>

        <div class="form-actions">
          <a class="btn btn-ghost" href="{{ url_for('project', pid=project.id) }}">Cancel</a>
          <button type="submit" class="btn btn-primary">Save changes</button>
        </div>
      </form>
    </div>
  </div>
</section>
{% endblock %}
