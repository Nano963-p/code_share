{% extends "base.html" %}
{% block content %}

<section class="page-head">
  <div>
    <h1>Profile</h1>
    <p class="muted">Update your public information.</p>
  </div>
</section>

<div class="card">
  <form method="post" class="form">
    <label>Username</label>
    <input name="username" value="{{ user.username }}" required>

    <label>Email</label>
    <input value="{{ user.email }}" disabled>

    <label>Bio</label>
    <textarea name="bio" rows="4">{{ user.bio or '' }}</textarea>

    <div class="row">
      <div class="pill"><span class="mini users"></span> followers: {{ user.followers_count }}</div>
      <div class="pill"><span class="mini users"></span> following: {{ user.following_count }}</div>
    </div>

    <button class="btn btn-primary" type="submit">Save</button>
  </form>
</div>

{% endblock %}
