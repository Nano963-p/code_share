{% extends "base.html" %}
{% block title %}Sign Up · CodeShare{% endblock %}

{% block content %}
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">🪐</div>
      <div class="auth-header-text">
        <h1>Create account</h1>
        <p>Join CodeShare in seconds</p>
      </div>
    </div>

    <form method="POST" action="{{ url_for('signup') }}" class="auth-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input id="username" name="username" required autocomplete="username" placeholder="Choose a username">
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" name="email" required autocomplete="email" placeholder="Enter your email">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" name="password" required autocomplete="new-password" placeholder="Create a password">
      </div>

      <div class="form-group">
        <label for="confirm_password">Confirm password</label>
        <input id="confirm_password" type="password" name="confirm_password" required autocomplete="new-password" placeholder="Confirm your password">
      </div>

      <button class="auth-btn" type="submit">Sign Up</button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="{{ url_for('login') }}">Login</a>
    </div>
  </div>
{% endblock %}
