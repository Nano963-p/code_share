{% extends "base.html" %}
{% block title %}Sign Up · CodeShare{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="panel auth-card">
    <div class="auth-brand">
      <img src="{{ url_for('static', filename='img/saturn.png') }}" alt="Saturn">
      <div>
        <h1>Create account</h1>
        <div class="muted">Join CodeShare in seconds</div>
      </div>
    </div>

    <form method="POST" action="{{ url_for('signup') }}" class="auth-form">
      <label>Username</label>
      <input name="username" required>

      <label>Email</label>
      <input name="email" type="email" required>

      <label>Password</label>
      <input name="password" type="password" required>

      <label>Confirm password</label>
      <input name="confirm_password" type="password" required>

      <button class="btn btn-primary w100" type="submit">Sign Up</button>
    </form>

    <div class="auth-foot">
      <span class="muted">Already have an account?</span>
      <a class="link" href="{{ url_for('login') }}">Login</a>
    </div>
  </div>
</div>
{% endblock %}
