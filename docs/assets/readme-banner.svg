<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Code Share</title>
  <desc id="desc">Share projects. Explore code. Learn together. An academic Flask and MySQL application.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#0f172a"/>
      <stop offset="1" stop-color="#164e63"/>
    </linearGradient>
    <linearGradient id="accent" x2="1">
      <stop stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="20" fill="url(#background)"/>
  <circle cx="1140" cy="35" r="200" fill="#38bdf8" opacity=".06"/>
  <circle cx="1060" cy="300" r="180" fill="#5eead4" opacity=".05"/>
  <rect x="56" y="56" width="44" height="5" rx="2.5" fill="url(#accent)"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="56" y="98" fill="#7dd3fc" font-size="14" font-weight="600" letter-spacing="3">ACADEMIC SOFTWARE PROJECT</text>
    <text x="52" y="173" fill="#f8fafc" font-size="66" font-weight="700">Code Share</text>
    <text x="56" y="220" fill="#cbd5e1" font-size="22">Share projects. Explore code. Learn together.</text>
    <text x="56" y="263" fill="#94a3b8" font-size="14" letter-spacing="1">PYTHON / FLASK / MYSQL</text>
  </g>
  <g fill="none" stroke="url(#accent)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M930 110 885 150 930 190 M1040 110 1085 150 1040 190 M1005 95 968 205"/>
